<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMU Exercise Band Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/open-sauce-one@5.2.5/300.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/open-sauce-one@5.2.5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/open-sauce-one@5.2.5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/open-sauce-one@5.2.5/900.css">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<header class="top">
  <button class="mark" id="homeBtn">IMU Exercise Band Tracker</button>

  <div class="links">
    <div class="link" id="wifiLink">
      <span class="lbl">Wi‑Fi</span>
      <input id="host" value="arduino.local:5555" spellcheck="false" aria-label="Yun address">
      <button id="wifiBtn" class="btn">Connect</button>
      <span class="state"><span></span></span>
    </div>
    <div class="link" id="usbLink">
      <span class="lbl">USB</span>
      <button id="usbBtn" class="btn">Choose port</button>
      <span class="state"><span></span></span>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- step 1: pick -->
  <section id="pickScreen" class="pick">
    <h1 class="title">Pick an exercise</h1>
    <ol id="exercises" class="pick-list"></ol>
    <a class="credits" href="CREDITS.md">Photo credits</a>
  </section>

  <!-- steps 2 + 3: calibrate, then track reps -->
  <section id="stage" class="hero" hidden>
    <div class="hero-left">
      <button class="back" id="backBtn">← Exercises</button>
      <h2 id="exName"></h2>
      <p id="placement" class="placement"></p>
      <img id="exPhoto" class="ex-photo" alt="">

      <!-- step 2: calibrate -->
      <div id="calibView" class="calib">
        <button class="step" id="capStart">
          <b>A</b>
          <span><em id="startHow"></em><small id="startVal"></small></span>
        </button>
        <button class="step" id="capFinal">
          <b>B</b>
          <span><em id="finalHow"></em><small id="finalVal"></small></span>
        </button>

        <button id="saveBtn" class="btn bright" disabled>Save calibration</button>
      </div>

      <!-- step 3: reps -->
      <div id="workView" hidden>
        <div class="count"><span id="reps">0</span><span class="count-lbl">Reps</span></div>
        <div id="tracker" class="tracker" aria-label="Reps"></div>
        <div class="actions">
          <button id="resetSet" class="btn line">Reset</button>
          <button id="recalBtn" class="btn line">Recalibrate</button>
        </div>
      </div>

      <p id="cue" class="cue"></p>
    </div>

    <div class="hero-right">
      <svg id="dial" viewBox="0 0 600 330" aria-label="Live joint angle">
        <g id="ticks"></g>
        <path id="track" class="track"/>
        <path id="fill" class="fill"/>
        <path id="zoneStart" class="zone start"/>
        <path id="zoneFinal" class="zone final"/>
        <g id="needle"><line x1="300" y1="310" x2="300" y2="80"/></g>
        <circle cx="300" cy="310" r="10" class="hub"/>
      </svg>

      <dl class="readout">
        <div><dt>Angle</dt><dd id="angle">—</dd></div>
        <div><dt>Range</dt><dd id="romPct">—</dd></div>
        <div><dt>Short</dt><dd id="partials">0</dd></div>
      </dl>
    </div>
  </section>

</main>

<script src="app.js?v=5"></script>
</body>
</html>
